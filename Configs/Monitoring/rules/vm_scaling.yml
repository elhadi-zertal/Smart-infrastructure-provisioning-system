# =============================================================================
# /etc/prometheus/rules/vm_scaling.yml — PROACTIVE EDITION
# -----------------------------------------------------------------------------
# Two changes vs the previous version:
#
#   1. The vmid/hostname label-join is now OPTIONAL.  If app.py SD didn't
#      include vmid for a given host, the alert still fires (with vmid="")
#      and main.py's IP-fallback finds the VM in cluster_state.
#      Achieved by using `or on(instance)` to retain rows that don't match
#      vm_info.
#
#   2. Thresholds lowered to fire BEFORE timeouts:
#         CPU/RAM warning:  80→70%  for 1m → 30s
#         packet loss:      2%  →  1%       for 1m → 30s
# =============================================================================

groups:

  - name: aggregations
    interval: 15s
    rules:
      - record: pfe:nginx_5xx_rate_per_upstream
        expr: |
          (sum by (upstream) (rate(nginx_vts_upstream_responses_total{code="5xx"}[2m])) /
          (sum by (upstream) (rate(nginx_vts_upstream_responses_total[2m])) > 0)) * 100

      - record: pfe:nginx_5xx_rate_per_backend
        expr: |
          (sum by (upstream, backend) (rate(nginx_vts_upstream_responses_total{code="5xx"}[2m])) /
          (sum by (upstream, backend) (rate(nginx_vts_upstream_responses_total[2m])) > 0)) * 100

      # vm_info: every UP node_exporter target.  Inherits all SD labels
      # (vmid, hostname, type, env) that app.py provides.  Missing vmid
      # is handled at alert level via `or on(instance)`.
      - record: vm_info
        expr: up{job="node_exporter"} == 1
        labels:
          source: "service_discovery"

  # ===========================================================================
  # HTTP 5xx — only alert on K8s upstreams (default__*)
  # ===========================================================================
  - name: http_errors
    rules:
      - alert: HTTP5xxWarning
        expr: |
          label_replace(
            label_replace(
              pfe:nginx_5xx_rate_per_upstream{upstream=~"default__.+"} > 1,
              "namespace", "$1", "upstream", "(.+?)__.+"
            ),
            "deployment", "$1", "upstream", ".+?__(.+)"
          )
        for: 30s
        labels:
          severity:    warning
          type:        http_5xx
          target_type: k8s
          action:      horizontal_scaling
        annotations:
          summary: "5xx > 1% on upstream {{ $labels.upstream }}"

      - alert: HTTP5xxCritical
        expr: |
          label_replace(
            label_replace(
              pfe:nginx_5xx_rate_per_upstream{upstream=~"default__.+"} > 5,
              "namespace", "$1", "upstream", "(.+?)__.+"
            ),
            "deployment", "$1", "upstream", ".+?__(.+)"
          )
        for: 15s
        labels:
          severity:    critical
          type:        http_5xx
          target_type: k8s
          action:      horizontal_scaling
        annotations:
          summary: "5xx > 5% on upstream {{ $labels.upstream }}"

  # ===========================================================================
  # Network — packet loss / TCP backlog (PROACTIVE: 2%→1%, 1m→30s)
  # ===========================================================================
  - name: network
    rules:
      - alert: PacketLossCritical
        expr: |
          (
            (
              rate(node_network_receive_drop_total{device!="lo"}[2m])
              /
              (rate(node_network_receive_packets_total{device!="lo"}[2m]) + 1)
            ) * 100
          )
          *
          on(instance) group_left(vmid, hostname)
          (vm_info > 0)
          > 1
        for: 30s
        labels:
          severity:    critical
          type:        network
          target_type: vm
          action:      horizontal_scaling
        annotations:
          summary: "Packet loss > 1% on {{ $labels.instance }} (vmid={{ $labels.vmid }})"
          description: "Drop rate {{ $value | printf \"%.2f\" }}% — clone VM."

      - alert: VMTcpQueueOverflow
        expr: |
          (
            rate(node_netstat_TcpExt_ListenDrops[1m]) > 0
            or
            rate(node_netstat_TcpExt_ListenOverflows[1m]) > 0
          )
          *
          on(instance) group_left(vmid, hostname)
          (vm_info > 0)
        for: 30s
        labels:
          severity:    critical
          type:        network
          target_type: vm
          action:      horizontal_scaling
        annotations:
          summary: "TCP backlog overflow on {{ $labels.instance }} — kernel rejecting connections"

  # ===========================================================================
  # CPU — vertical at warn, horizontal at critical
  # ===========================================================================
  - name: cpu
    rules:
      - alert: CPUWarning
        # 80→70%, 1m→30s
        expr: |
          (
            100 - (avg by(instance, job) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100)
          )
          *
          on(instance) group_left(vmid, hostname)
          (vm_info > 0)
          > 70
        for: 30s
        labels:
          severity:    warning
          type:        cpu
          target_type: vm
          action:      vertical_scaling_cpu
        annotations:
          summary: "CPU > 70% on {{ $labels.instance }} (vmid={{ $labels.vmid }})"

      - alert: CPUCritical
        # At critical, ALSO trigger horizontal_scaling — vertical alone may not
        # be enough if the VM is already at max CPU on its physical host.
        expr: |
          (
            100 - (avg by(instance, job) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100)
          )
          *
          on(instance) group_left(vmid, hostname)
          (vm_info > 0)
          > 90
        for: 15s
        labels:
          severity:    critical
          type:        cpu
          target_type: vm
          action:      horizontal_scaling
        annotations:
          summary: "CPU > 90% on {{ $labels.instance }} — clone VM"

  # ===========================================================================
  # Memory — proactive thresholds
  # ===========================================================================
  - name: memory
    rules:
      - alert: RAMWarning
        # 60→55%, 1m→30s
        expr: |
          (
            (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100
          )
          *
          on(instance) group_left(vmid, hostname)
          (vm_info > 0)
          > 55
        for: 30s
        labels:
          severity:    warning
          type:        memory
          target_type: vm
          action:      vertical_scaling_ram
        annotations:
          summary: "RAM > 55% on {{ $labels.instance }} (vmid={{ $labels.vmid }})"

      - alert: RAMCritical
        # 80→75%, also escalate to horizontal
        expr: |
          (
            (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100
          )
          *
          on(instance) group_left(vmid, hostname)
          (vm_info > 0)
          > 75
        for: 30s
        labels:
          severity:    critical
          type:        memory
          target_type: vm
          action:      horizontal_scaling
        annotations:
          summary: "RAM > 75% on {{ $labels.instance }} — clone VM"

  # ===========================================================================
  # Disk I/O — vertical scaling
  # ===========================================================================
  - name: disk
    rules:
      - alert: DiskIOWarning
        expr: |
          (
            (1 - rate(node_disk_io_time_seconds_total{device!~"sr.*|loop.*"}[5m])) * 100
          )
          *
          on(instance) group_left(vmid, hostname)
          (vm_info > 0)
          < 20
        for: 2m
        labels:
          severity:    warning
          type:        disk_io
          target_type: vm
          action:      vertical_scaling_disk
        annotations:
          summary: "Disk I/O free < 20% on {{ $labels.instance }}"

      - alert: DiskIOCritical
        expr: |
          (
            (1 - rate(node_disk_io_time_seconds_total{device!~"sr.*|loop.*"}[5m])) * 100
          )
          *
          on(instance) group_left(vmid, hostname)
          (vm_info > 0)
          < 10
        for: 1m
        labels:
          severity:    critical
          type:        disk_io
          target_type: vm
          action:      vertical_scaling_disk
        annotations:
          summary: "Disk I/O free < 10% on {{ $labels.instance }}"

  # ===========================================================================
  # Availability
  # ===========================================================================
  - name: vm_availability_detailed
    rules:
      - alert: VMUnreachable
        expr: up{job="node_exporter"} == 0
        for: 1m
        labels:
          severity: critical
          action: check_network_then_migrate
        annotations:
          summary: "VM {{ $labels.instance }} inaccessible"

      - alert: ScaphandreDown
        expr: up{job="scaphandre"} == 0
        for: 1m
        labels:
          severity: warning
          action: restart_scaphandre
        annotations:
          summary: "Scaphandre down on {{ $labels.instance }}"

  - name: energy
    rules:
      - alert: VMHighPowerConsumption
        expr: sum by(instance, vm_id, vm_name) (scaph_vm_power_microwatts{job="scaphandre"}) / 1000000 > 50
        for: 5m
        labels:
          severity: warning
          action: investigate_power
        annotations:
          summary: "High consumption on VM {{ $labels.vm_name }}"

  - name: load_balancer_health
    rules:
      - alert: NginxLBDown
        expr: up{job="nginx_lb"} == 0
        for: 1m
        labels:
          severity: critical
          action: restart_nginx_or_failover
        annotations:
          summary: "NGINX LB {{ $labels.instance }} unreachable"
