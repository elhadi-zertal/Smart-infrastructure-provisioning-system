global:
  resolve_timeout: 1m

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: ['alertname', 'instance']

  - source_matchers: [alertname="NginxLBDown"]
    target_matchers: [type="http_5xx"]
    equal: ['cluster']

route:
  receiver: 'main-py-default'
  group_by: ['alertname']
  group_wait: 5s
  group_interval: 15s
  repeat_interval: 5m

  routes:
    - matchers:
        - severity = critical
      receiver: 'main-py-critical'
      group_wait: 0s
      group_interval: 5s
      repeat_interval: 2m
      continue: true

    - matchers:
        - type = http_5xx
        - target_type = k8s
      receiver: 'main-py-default'
      group_by: ['alertname', 'upstream']
      group_wait: 5s
      group_interval: 15s
      repeat_interval: 5m

    - matchers:
        - target_type =~ "vm|lxc"
      receiver: 'main-py-default'
      group_by: ['alertname', 'instance', 'vmid']
      group_wait: 5s
      group_interval: 15s

    - matchers:
        - severity = warning
      receiver: 'main-py-default'

    # Info severity: still go to main-py so alerts surface in /actions log,
    # just at lower priority.  Empty webhook_configs caused config errors
    # in some Alertmanager versions.
    - matchers:
        - severity = info
      receiver: 'main-py-default'
      group_wait: 30s
      repeat_interval: 30m

receivers:
  - name: 'main-py-default'
    webhook_configs:
      - url: 'http://10.30.30.101:8000/alert'
        send_resolved: true
        max_alerts: 0

  - name: 'main-py-critical'
    webhook_configs:
      - url: 'http://10.30.30.101:8000/alert'
        send_resolved: true
        max_alerts: 0
